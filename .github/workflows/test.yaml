name: Test Python Package

# Runs the test suite and the lint/type checks on every push and on pull
# requests into main.
#
# Note on scope: the suite is run with pytest directly against the flat `waper/`
# package. There is no test-runner wrapper; these are the same commands a
# contributor runs locally (see CONTRIBUTING.md).
#
# Slow tests are deselected: they load `datasets/forecast_bust_hourly.nc` and
# `datasets/v_winds_300mb_nh_2022_2023.nc`, which are gitignored data files not
# present on a fresh checkout.

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned to 3.12: mypy reads numpy's bundled stubs, which use `type`
      # statement syntax that only parses on 3.12+.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Full dependencies, because numpy/pandas/matplotlib ship `py.typed` and
      # mypy only sees their real types when they are installed. Neither tool
      # imports the package, so the OpenGL runtime the test job needs is not
      # required here. The linters are then pinned over whatever `[dev]`
      # resolved, so a new ruff or mypy release cannot fail an unrelated push;
      # bump these deliberately.
      - name: Install package and linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install ruff==0.16.1 mypy==2.3.0

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy

  test_suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # VTK and PyVista are imported at collection time and need an OpenGL
      # runtime even when rendering off-screen.
      - name: Install system OpenGL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglx-mesa0 libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        env:
          PYVISTA_OFF_SCREEN: "true"
        run: |
          pytest -m "not slow" -ra \
            --cov --cov-report=term-missing \
            --cov-report=xml:coverage-${{ matrix.python-version }}.xml

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage-${{ matrix.python-version }}.xml
          if-no-files-found: warn
