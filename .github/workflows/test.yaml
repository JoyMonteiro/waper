name: Test Python Package

# Runs the test suite on every push and on pull requests into main.
#
# Note on scope: this workflow deliberately does NOT go through tox. `tox.ini` is
# unmodified cookiecutter scaffolding (it targets a `src/my_new_project` layout that
# has never existed in this repo) and every tox env it defines is broken. The suite
# is run with pytest directly against the flat `waper/` package.
#
# Slow tests are deselected: they load `datasets/forecast_bust_hourly.nc` and
# `datasets/v_winds_300mb_nh_2022_2023.nc`, which are gitignored data files not
# present on a fresh checkout.

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # VTK and PyVista are imported at collection time and need an OpenGL
      # runtime even when rendering off-screen.
      - name: Install system OpenGL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglx-mesa0 libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        env:
          PYVISTA_OFF_SCREEN: "true"
        run: |
          pytest -m "not slow" -ra \
            --cov --cov-report=term-missing \
            --cov-report=xml:coverage-${{ matrix.python-version }}.xml

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage-${{ matrix.python-version }}.xml
          if-no-files-found: warn
