# BUILD

[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"


# Information required for building (sdist/wheel)
## Also renders on pypi as 'subtitle'
[project]
name = "waper"
version = "0.1.0"
description = "Rossby wave packet tracker"
authors = [{name="Malavika Biju"},
            {name="Joy Monteiro"},
            {name="Karran Pandey"}]
maintainers = [{name="Joy Monteiro", email="joy.merwin@gmail.com"}]
license = {file= "LICENSE"}
readme = "README.rst"
requires-python = ">= 3.11"

keywords = [
    "python package",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    # `license = {file = "LICENSE"}` above is the authoritative statement; this
    # classifier exists so PyPI can facet on it. PyPI's trove list has no
    # 3-Clause-specific BSD entry, so plain "BSD License" is the correct value.
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Software Distribution",
    "Typing :: Typed"
]

dependencies = [
    # Upper bound is set by numba (pulled in via datashader, used for the
    # explorer's rasterized field layer): numba requires numpy <= 2.4.
    "numpy >= 1.22, < 2.5",
    "scipy >= 1.9",
    "xarray >= 2022.6",
    "networkx >= 2.8",
    "pyvista >= 0.36",
    "geovista >= 0.4",
    "vtk >= 9.1",
    "scikit-learn >= 1.1",
    "shapely >= 1.8",
    "rasterio >= 1.3",
    "pyproj >= 3.4",
    "cartopy >= 0.21",
    "matplotlib >= 3.6",
    "tqdm >= 4.64",
    "pyarrow",
    "geopandas",
    "zarr",
    "hvplot",
    "holoviews",
    "geoviews",
    "panel",
    "panel-material-ui",
    "datashader",
    "pyyaml"
]

[project.optional-dependencies]
dev = ["pytest >= 7.0", "pytest-cov", "mypy", "ruff", "nbstripout"]
# Docs toolchain. `quarto` itself is not a Python package: install it separately
# (https://quarto.org/docs/get-started/), or let the CI action do it.
#
# `griffe` is quartodoc's introspection backend and would be pulled in anyway;
# it is named here so it is the one place to add a constraint if a griffe
# release breaks `quartodoc build`. Deliberately left unpinned: quartodoc 0.11
# builds this package's API reference cleanly against griffe 2.1, so the
# `griffe<2.0` bound some older quartodoc setups need does not apply.
#
# `jupyter` is what Quarto shells out to for executable code cells. No page has
# one today, so it is here to keep adding one from becoming a CI change.
docs = ["quartodoc >= 0.7", "griffe", "jupyter"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["slow: integration runs that load data"]


# LINTING

[tool.ruff]
line-length = 100
# `target-version` is inferred from `project.requires-python` (py311).
extend-exclude = [
    # Standalone research code from before the package existed. It imports
    # modules that are not dependencies (myCmap, cmocean) and nothing in the
    # package or tests imports it.
    "misc",
    # Exploratory notebooks: outputs are stripped on commit, but the code in
    # them is scratch work and is not held to package style.
    "*.ipynb",
]

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's default selection, which
# varies between ruff releases.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific
    "D",    # pydocstyle — scoped to the documented API surface, see per-file-ignores
]
ignore = [
    # No autoformatter runs on this repo, so line length is advisory; the
    # `line-length` setting above still drives fixes that wrap code.
    "E501",
    # En dashes and multiplication signs in prose ("18–24 h", "5 × 5") are
    # deliberate, not typos for ASCII lookalikes.
    "RUF001",
    "RUF002",
    "RUF003",
    # Module and package docstrings are not the point here; the API reference
    # renders objects, not modules. `__init__` is documented on its class.
    "D100", "D104", "D105", "D107",
]

[tool.ruff.lint.per-file-ignores]
# Unused imports in `__init__.py` are the re-export surface.
"__init__.py" = ["F401"]
# Diagnostic scripts must run side effects before importing: `matplotlib.use("Agg")`
# ahead of `pyplot`, `warnings.filterwarnings` ahead of the vtk/pyvista chain.
# They also use the same compact `a = f(); a.x = 1` idiom as the tests.
# Tests set up fixtures with a deliberately compact one-line idiom
# (`f0 = _feat(0, "max", 0); f0.lat = 60.0`).
#
# `D` is deliberately scoped to the surface quartodoc renders (docs/_quarto.yml)
# plus the io layer users call directly. Everything else is internal: adding
# docstring pressure there would bury the pages that are actually published.
"waper/identification/*" = ["D"]
"waper/tracking/*" = ["D"]
"waper/interface/visualization.py" = ["D"]
"waper/interface/colormaps.py" = ["D"]
"tests/*" = ["D", "E702"]
"scripts/*" = ["D", "E402", "E702"]
"datasets/*" = ["D", "E402", "E702"]
"misc/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
files = ["waper"]
# No `python_version` pin: it defaults to the interpreter mypy runs under, and
# numpy's bundled stubs need 3.12+ syntax to parse.
# The scientific stack this package builds on (vtk, pyvista, geovista, cartopy,
# rasterio, hvplot, ...) ships no type information, so unresolved imports from
# third-party packages are not actionable findings.
ignore_missing_imports = true
# Most of the package is unannotated; checking function bodies without
# annotations produces noise rather than signal. Annotated code is checked
# normally, so typing can be tightened file by file.
check_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[tool.setuptools]
packages=["waper", "waper.identification", "waper.tracking", "waper.interface", "waper.io"]

# A list of all of the optional dependencies, some of which are included in the
# below `extras`. They can be opted into by apps.


# PyPi url links, that appear in 'Project Links' section
[project.urls]
"Bug Tracker" = "https://github.com/JoyMonteiro/waper/issues"
"CI: Github Actions" = "https://github.com/JoyMonteiro/waper/actions"
"Documentation" = "https://joymonteiro.github.io/waper/"
"Source Code" = "https://github.com/JoyMonteiro/waper"
"Changelog" = "https://github.com/JoyMonteiro/waper/blob/main/HISTORY.md"
"Code of Conduct" = "https://github.com/JoyMonteiro/waper/blob/main/CONTRIBUTING.md"
